<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMV Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f4ed;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #3d1520 0%, #5a1a2a 50%, #2d1117 100%);
            color: #f0e8d8;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .room-badge {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #1a0a0a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }

        /* Category nav — horizontal scroll */
        .cat-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            background: #faf6ef;
            border-bottom: 1px solid #e8dcc8;
            position: sticky;
            top: 54px;
            z-index: 90;
            -webkit-overflow-scrolling: touch;
        }

        .cat-nav::-webkit-scrollbar { display: none; }

        .cat-pill {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #d4c5a9;
            background: #faf6ef;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: #6b5a4a;
            transition: all 0.2s;
        }

        .cat-pill.active {
            background: #3d1520;
            color: #d4af37;
            border-color: #3d1520;
        }

        /* Menu items */
        .menu-section {
            padding: 12px 16px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #3d1520;
            padding: 16px 0 10px;
            position: sticky;
            top: 100px;
            background: #f8f4ed;
            z-index: 50;
        }

        .menu-item {
            background: #fffdf8;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 1px 4px rgba(61,21,32,0.08);
            border: 1px solid #f0e8d8;
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-size: 16px;
            font-weight: 600;
            color: #2d1117;
            margin-bottom: 3px;
        }

        .item-desc {
            font-size: 13px;
            color: #8a7a6a;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .item-price {
            font-size: 16px;
            font-weight: 700;
            color: #b8860b;
            margin-top: 4px;
        }

        /* Dish image */
        .item-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            background: #f0f0f0;
            flex-shrink: 0;
        }

        .item-img.placeholder {
            display: none;
        }

        /* Quantity controls */
        .qty-wrap {
            display: flex;
            align-items: center;
            gap: 0;
            flex-shrink: 0;
        }

        .qty-btn {
            width: 40px;
            height: 40px;
            border: 2px solid #3d1520;
            background: #fffdf8;
            color: #3d1520;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .qty-btn:active {
            background: #3d1520;
            color: #d4af37;
            transform: scale(0.92);
        }

        .qty-count {
            min-width: 32px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .qty-count.zero {
            color: #ccc;
        }

        /* Add button — shown when qty is 0 */
        .add-btn {
            padding: 10px 22px;
            background: #3d1520;
            color: #d4af37;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .add-btn:active {
            transform: scale(0.95);
        }

        /* Cart bar */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #3d1520;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
            padding: 14px 20px;
            display: none;
            z-index: 200;
        }

        .cart-bar.show {
            display: block;
        }

        .cart-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .cart-left {
            font-size: 14px;
            color: #c0a080;
        }

        .cart-left strong {
            font-size: 20px;
            color: #f0e8d8;
        }

        .cart-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: #1a0a0a;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
        }

        .cart-btn:active {
            transform: scale(0.97);
        }

        /* Order placed overlay */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 300;
            justify-content: center;
            align-items: center;
        }

        .overlay.show {
            display: flex;
        }

        .overlay-card {
            background: linear-gradient(170deg, #faf6ef, #f0e8d8);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 340px;
            width: 90%;
            border: 1px solid rgba(212,175,55,0.3);
        }

        .overlay-icon {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .overlay-title {
            font-size: 22px;
            font-weight: 700;
            color: #3d1520;
            margin-bottom: 8px;
        }

        .overlay-sub {
            color: #6b5a4a;
            font-size: 15px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .overlay-btn {
            padding: 14px 30px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #1a0a0a;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>

    <div class="header">
        <div class="header-row">
            <h1>The Mangal View</h1>
            <span class="room-badge">Room <span id="roomNum">—</span></span>
        </div>
    </div>

    <div class="cat-nav" id="catNav"></div>

    <div class="menu-section" id="menuSection"></div>

    <div class="cart-bar" id="cartBar">
        <div class="cart-inner">
            <div class="cart-left">
                <span id="cartCount">0</span> items<br>
                <strong>₹<span id="cartTotal">0</span></strong>
            </div>
            <button class="cart-btn" onclick="placeOrder()">Place Order</button>
        </div>
    </div>

    <div class="cart-bar" id="browseBar" style="display:none;">
        <div class="cart-inner">
            <div class="cart-left" style="color:#f0e8d8;">
                Browsing menu only
            </div>
            <span class="cart-btn" style="text-align:center;">Dial 7 from room phone</span>
        </div>
    </div>

    <!-- Success overlay -->
    <div class="overlay" id="successOverlay">
        <div class="overlay-card">
            <div class="overlay-icon">✅</div>
            <div class="overlay-title">Order Placed!</div>
            <div class="overlay-sub">
                Your order has been sent to the kitchen.<br>
                Room <strong id="overlayRoom">—</strong>
            </div>
            <button class="overlay-btn" onclick="window.location.href='order-status.html'">Track Order</button>
        </div>
    </div>

    <script>
        let menuData = {};
        const cart = {};
        let disabledItems = {};
        let orderingOpen = true;
        const browseMode = new URLSearchParams(window.location.search).get('browse') === '1';
        const roomNumber = browseMode ? 'Menu' : (sessionStorage.getItem('userRoom') || '—');
        document.getElementById('roomNum').textContent = browseMode ? 'Browse' : roomNumber;
        document.getElementById('overlayRoom').textContent = roomNumber;

        if (roomNumber === '—' && !browseMode) window.location.href = 'guest.html';
        if (browseMode) document.getElementById('browseBar').style.display = 'block';

        fetch('menu.json')
            .then(r => r.json())
            .then(data => {
                menuData = data;
                database.ref('config').on('value', snap => {
                    const cfg = snap.val() || {};
                    disabledItems = cfg.disabledItems || {};
                    const enabled = cfg.orderingEnabled !== false;
                    const openTime = cfg.openTime || '07:00';
                    const closeTime = cfg.closeTime || '23:00';
                    const now = new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: false });
                    orderingOpen = enabled && (now >= openTime && now <= closeTime);
                    if (!orderingOpen && !browseMode) {
                        document.getElementById('browseBar').style.display = 'block';
                        document.getElementById('cartBar').classList.remove('show');
                        const browseLeft = document.querySelector('#browseBar .cart-left');
                        browseLeft.textContent = !enabled ? 'Online ordering is currently off' : `Kitchen hours: ${openTime} – ${closeTime} IST`;
                    }
                    buildCatNav();
                    buildMenu();
                });
            });

        function buildCatNav() {
            const nav = document.getElementById('catNav');
            const cats = Object.keys(menuData);
            nav.innerHTML = cats.map((cat, i) =>
                `<div class="cat-pill ${i === 0 ? 'active' : ''}" onclick="scrollToCat('${cat}', this)">${cat}</div>`
            ).join('');
        }

        function scrollToCat(cat, pill) {
            document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            const el = document.getElementById('cat-' + cat.replace(/[^a-zA-Z]/g, ''));
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function buildMenu() {
            const section = document.getElementById('menuSection');
            let html = '';
            for (const [cat, items] of Object.entries(menuData)) {
                const catId = 'cat-' + cat.replace(/[^a-zA-Z]/g, '');
                html += `<div id="${catId}" class="section-title">${cat}</div>`;
                items.forEach(item => {
                    if (disabledItems[item.id]) return;
                    const qty = cart[item.id] || 0;
                    const canOrder = !browseMode && orderingOpen;
                    html += `
                        <div class="menu-item" id="item-${item.id}">
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                <div class="item-desc">${item.description}</div>
                                <div class="item-price">₹${item.price}</div>
                            </div>
                            ${!canOrder ? '' : (qty === 0
                                ? `<button class="add-btn" onclick="addItem('${item.id}')">ADD</button>`
                                : `<div class="qty-wrap">
                                    <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
                                    <span class="qty-count">${qty}</span>
                                    <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                                  </div>`
                            )}
                        </div>`;
                });
            }
            section.innerHTML = html;
        }

        function getItem(id) {
            for (const items of Object.values(menuData)) {
                const item = items.find(i => i.id === id);
                if (item) return item;
            }
        }

        function addItem(id) {
            cart[id] = 1;
            rebuildItem(id);
            updateCart();
        }

        function changeQty(id, delta) {
            cart[id] = Math.max(0, (cart[id] || 0) + delta);
            if (cart[id] === 0) delete cart[id];
            rebuildItem(id);
            updateCart();
        }

        function rebuildItem(id) {
            const item = getItem(id);
            const el = document.getElementById('item-' + id);
            if (!el || !item) return;
            const qty = cart[id] || 0;
            const right = qty === 0
                ? `<button class="add-btn" onclick="addItem('${id}')">ADD</button>`
                : `<div class="qty-wrap">
                    <button class="qty-btn" onclick="changeQty('${id}', -1)">−</button>
                    <span class="qty-count">${qty}</span>
                    <button class="qty-btn" onclick="changeQty('${id}', 1)">+</button>
                  </div>`;
            el.innerHTML = `
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <div class="item-desc">${item.description}</div>
                    <div class="item-price">₹${item.price}</div>
                </div>
                ${right}`;
        }

        function updateCart() {
            let count = 0, total = 0;
            for (const [id, qty] of Object.entries(cart)) {
                const item = getItem(id);
                if (item) { count += qty; total += item.price * qty; }
            }
            document.getElementById('cartCount').textContent = count;
            document.getElementById('cartTotal').textContent = total;
            document.getElementById('cartBar').classList.toggle('show', count > 0);
        }

        function placeOrder() {
            if (Object.keys(cart).length === 0) return;
            const items = [];
            let total = 0;
            for (const [id, qty] of Object.entries(cart)) {
                const item = getItem(id);
                if (item) {
                    items.push({ name: item.name, quantity: qty, price: item.price, subtotal: item.price * qty });
                    total += item.price * qty;
                }
            }
            const order = { room: roomNumber, items, total, timestamp: new Date().toISOString(), status: 'pending' };
            const btn = document.querySelector('.cart-btn');
            btn.textContent = 'Sending...';
            btn.disabled = true;
            const newRef = database.ref('orders').push();
            sessionStorage.setItem('lastOrderKey', newRef.key);
            Promise.all([
                newRef.set(order),
                database.ref(`roomOrders/${roomNumber}/${newRef.key}`).set({ timestamp: order.timestamp, status: 'pending' })
            ]).then(() => {
                Object.keys(cart).forEach(k => delete cart[k]);
                buildMenu();
                updateCart();
                document.getElementById('successOverlay').classList.add('show');
            }).catch(() => {
                alert('Could not place order. Please try again.');
                btn.textContent = 'Place Order';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
