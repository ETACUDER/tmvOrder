<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMV QR Code Generator</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #3d1520 0%, #1a0a0a 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
            max-width: 800px;
            margin-left: auto; margin-right: auto;
        }
        .header h1 { color: #3d1520; font-size: 22px; margin-bottom: 6px; }
        .header p { color: #888; font-size: 14px; }

        .controls {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            max-width: 800px;
            margin-left: auto; margin-right: auto;
        }

        .control-row { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
        .control-row label { font-weight: 600; color: #333; min-width: 80px; font-size: 14px; }
        .control-row select {
            flex: 1; padding: 8px 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;
        }

        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            padding: 10px 20px; border: none; border-radius: 10px;
            font-size: 14px; font-weight: 600; cursor: pointer; color: white;
            transition: transform 0.15s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #3d1520, #5a1a2a); }
        .btn-green { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        .btn-blue { background: linear-gradient(135deg, #667eea, #764ba2); }

        .qr-container {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 800px;
            margin-left: auto; margin-right: auto;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .qr-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 2px solid #e8e8e8;
        }

        .room-label {
            background: #3d1520;
            color: #d4af37;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
        }

        .qr-code { display: flex; justify-content: center; }
        .qr-card canvas, .qr-card img { display: block; margin: 0 auto; }

        .qr-url {
            font-size: 10px; color: #999; margin-top: 6px;
        }

        .download-btn {
            margin-top: 6px; padding: 4px 10px; font-size: 11px;
            background: #27ae60; color: white; border: none;
            border-radius: 6px; cursor: pointer;
        }

        .status { text-align: center; padding: 12px; color: #888; font-size: 13px; }

        @media print {
            @page { size: A4 portrait; margin: 8mm; }
            body { background: white; padding: 0; }
            .header, .controls { display: none !important; }
            .qr-container { box-shadow: none; padding: 0; border-radius: 0; max-width: 100%; }
            .qr-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .qr-card { border: 1px solid #ccc; padding: 8px; break-inside: avoid; border-radius: 4px; }
            .qr-card canvas, .qr-card .qr-code img { width: 110px !important; height: 110px !important; }
            .download-btn { display: none !important; }
            .room-label { font-size: 13px; padding: 4px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>TMV QR Code Generator</h1>
        <p>Rooms 109-112, 201-212, 301-312, 401-412</p>
        <a href="admin.html" style="color:#3d1520;font-size:13px;">← Back to Orders</a>
    </div>

    <div class="controls">
        <div class="control-row">
            <label>Floor:</label>
            <select id="floorSelect">
                <option value="all" selected>All Floors (40 rooms)</option>
                <option value="1">1st Floor (109-112)</option>
                <option value="2">2nd Floor (201-212)</option>
                <option value="3">3rd Floor (301-312)</option>
                <option value="4">4th Floor (401-412)</option>
            </select>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" onclick="generate()">Generate</button>
            <button class="btn btn-green" onclick="downloadPDF()">Download A4 PDF</button>
            <button class="btn btn-blue" onclick="window.print()">Print</button>
        </div>
    </div>

    <div class="qr-container">
        <div class="qr-grid" id="qrGrid"></div>
        <div class="status" id="status"></div>
    </div>

    <script>
        const BASE_URL = 'https://order.themangalview.com/guest.html';
        const qrDataURLs = {}; // room -> dataURL cache

        function getRooms(floor) {
            if (floor === '1') return Array.from({length: 4}, (_, i) => 109 + i);
            if (floor === '2') return Array.from({length: 12}, (_, i) => 201 + i);
            if (floor === '3') return Array.from({length: 12}, (_, i) => 301 + i);
            if (floor === '4') return Array.from({length: 12}, (_, i) => 401 + i);
            // all
            return [
                ...Array.from({length: 4}, (_, i) => 109 + i),
                ...Array.from({length: 12}, (_, i) => 201 + i),
                ...Array.from({length: 12}, (_, i) => 301 + i),
                ...Array.from({length: 12}, (_, i) => 401 + i),
            ];
        }

        function generate() {
            const floor = document.getElementById('floorSelect').value;
            const rooms = getRooms(floor);
            const grid = document.getElementById('qrGrid');
            const status = document.getElementById('status');
            grid.innerHTML = '';
            status.textContent = 'Generating...';

            rooms.forEach(room => {
                const url = `${BASE_URL}?room=${room}`;

                const card = document.createElement('div');
                card.className = 'qr-card';
                card.id = `card-${room}`;

                const label = document.createElement('div');
                label.className = 'room-label';
                label.textContent = `Room ${room}`;
                card.appendChild(label);

                const qrDiv = document.createElement('div');
                qrDiv.className = 'qr-code';
                qrDiv.id = `qr-${room}`;
                card.appendChild(qrDiv);

                const urlText = document.createElement('div');
                urlText.className = 'qr-url';
                urlText.textContent = 'order.themangalview.com';
                card.appendChild(urlText);

                const dlBtn = document.createElement('button');
                dlBtn.className = 'download-btn';
                dlBtn.textContent = 'Download PNG';
                dlBtn.onclick = () => downloadSingle(room);
                card.appendChild(dlBtn);

                grid.appendChild(card);

                new QRCode(qrDiv, {
                    text: url,
                    width: 150,
                    height: 150,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
            });

            // Wait for QRCode.js to render (it creates canvas + img)
            setTimeout(() => {
                rooms.forEach(room => {
                    const el = document.getElementById(`qr-${room}`);
                    const canvas = el.querySelector('canvas');
                    const img = el.querySelector('img');
                    if (canvas) {
                        qrDataURLs[room] = canvas.toDataURL('image/png');
                    } else if (img) {
                        qrDataURLs[room] = img.src;
                    }
                });
                status.textContent = `${rooms.length} QR codes generated`;
            }, 500);
        }

        function downloadSingle(room) {
            if (!qrDataURLs[room]) return;
            const a = document.createElement('a');
            a.download = `TMV_Room_${room}_QR.png`;
            a.href = qrDataURLs[room];
            a.click();
        }

        function downloadPDF() {
            const cards = document.querySelectorAll('.qr-card');
            if (cards.length === 0) { alert('Generate QR codes first'); return; }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pw = 210, ph = 297;
            const cols = 3, rows = 5;
            const perPage = cols * rows;
            const cw = 62, ch = 54;
            const mx = (pw - cols * cw) / 2;
            const my = 14;

            // Title
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text('The Mangal View — Room Service QR Codes', pw / 2, 9, { align: 'center' });

            let idx = 0;
            cards.forEach((card, i) => {
                if (i > 0 && i % perPage === 0) {
                    doc.addPage();
                    idx = 0;
                    // Title on subsequent pages
                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'normal');
                    doc.text('TMV Room Service QR Codes (contd.)', pw / 2, 9, { align: 'center' });
                }

                const col = idx % cols;
                const row = Math.floor(idx / cols);
                const x = mx + col * cw;
                const y = my + row * ch;

                // Border
                doc.setDrawColor(180);
                doc.setLineWidth(0.3);
                doc.roundedRect(x + 1, y, cw - 2, ch - 2, 2, 2);

                // Room label background
                doc.setFillColor(61, 21, 32);
                doc.roundedRect(x + 4, y + 2, cw - 8, 8, 1, 1, 'F');
                doc.setFontSize(10);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor(212, 175, 55);
                const label = card.querySelector('.room-label').textContent;
                doc.text(label, x + cw / 2, y + 8, { align: 'center' });

                // QR image
                const canvas = card.querySelector('.qr-code canvas');
                const img = card.querySelector('.qr-code img');
                const src = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
                if (src) {
                    doc.addImage(src, 'PNG', x + (cw - 34) / 2, y + 13, 34, 34);
                }

                // URL
                doc.setFontSize(6);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor(120, 120, 120);
                doc.text('order.themangalview.com', x + cw / 2, y + 51, { align: 'center' });

                doc.setTextColor(0, 0, 0);
                idx++;
            });

            doc.save('TMV_Room_QR_Codes.pdf');
        }

        // Auth gate
        firebase.auth().onAuthStateChanged(user => {
            if (user && user.email === 'themangalview@gmail.com') {
                generate();
            } else {
                window.location.href = 'admin.html';
            }
        });
    </script>
</body>
</html>
