<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMV QR Code Generator - Room Service</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .controls {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .control-group {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            color: #333;
            min-width: 120px;
        }

        input, select {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .qr-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .qr-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .qr-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .room-label {
            background: #667eea;
            color: white;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .qr-code {
            background: white;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            margin: 5px 0;
        }

        .qr-url {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            word-break: break-all;
            background: white;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
        }

        .download-btn {
            margin-top: 5px;
            padding: 6px 12px;
            font-size: 12px;
            background: #27ae60;
        }

        .download-btn:hover {
            box-shadow: 0 5px 10px rgba(39, 174, 96, 0.3);
        }

        .print-page {
            display: none;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .header, .controls, button {
                display: none !important;
            }

            .qr-container {
                box-shadow: none;
                max-width: 100%;
            }

            .qr-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .qr-card {
                page-break-inside: avoid;
                border: 1px solid #ccc;
            }

            .print-page {
                display: block;
                text-align: center;
                margin-bottom: 20px;
                font-size: 24px;
                font-weight: bold;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>TMV QR Code Generator</h1>
        <p class="subtitle">Generate QR codes for all rooms (109-112, 201-212, 301-312, 401-412)</p>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>Base URL:</label>
            <input type="text" id="baseUrl" value="https://order.themangalview.com/guest.html" readonly>
        </div>
        <div class="control-group">
            <label>Floor:</label>
            <select id="floorSelect">
                <option value="1">First Floor (109-112)</option>
                <option value="2">Second Floor (201-212)</option>
                <option value="3">Third Floor (301-312)</option>
                <option value="4">Fourth Floor (401-412)</option>
                <option value="all" selected>All Floors</option>
            </select>
        </div>
        <div class="btn-group">
            <button onclick="generateByFloor()">🔄 Generate Selected Floor</button>
            <button onclick="generateAllRooms()">⚡ Generate All Rooms (40 total)</button>
            <button onclick="window.print()">🖨️ Print All</button>
            <button onclick="downloadPDF()" style="background:linear-gradient(135deg,#27ae60,#2ecc71);">📄 Download A4 PDF</button>
        </div>
    </div>

    <div class="qr-container">
        <div class="print-page">TMV Room Service QR Codes</div>
        <div class="qr-grid" id="qrGrid">
            <!-- QR codes will be generated here -->
        </div>
    </div>

    <script>
        function generateByFloor() {
            const baseUrl = document.getElementById('baseUrl').value;
            const floor = document.getElementById('floorSelect').value;
            const qrGrid = document.getElementById('qrGrid');
            qrGrid.innerHTML = '';

            if (floor === 'all') {
                generateAllRooms();
                return;
            }

            let startRoom, endRoom;
            switch(floor) {
                case '1':
                    startRoom = 109;
                    endRoom = 112;
                    break;
                case '2':
                    startRoom = 201;
                    endRoom = 212;
                    break;
                case '3':
                    startRoom = 301;
                    endRoom = 312;
                    break;
                case '4':
                    startRoom = 401;
                    endRoom = 412;
                    break;
            }

            for (let room = startRoom; room <= endRoom; room++) {
                createQRCard(baseUrl, room);
            }
        }

        function generateAllRooms() {
            const baseUrl = document.getElementById('baseUrl').value;
            const qrGrid = document.getElementById('qrGrid');
            qrGrid.innerHTML = '';

            // Generate for actual room numbers
            // First floor: 109-112
            for (let room = 109; room <= 112; room++) {
                createQRCard(baseUrl, room);
            }

            // Second floor: 201-212
            for (let room = 201; room <= 212; room++) {
                createQRCard(baseUrl, room);
            }

            // Third floor: 301-312
            for (let room = 301; room <= 312; room++) {
                createQRCard(baseUrl, room);
            }

            // Fourth floor: 401-412
            for (let room = 401; room <= 412; room++) {
                createQRCard(baseUrl, room);
            }
        }

        function createQRCard(baseUrl, roomNumber) {
            const url = `${baseUrl}?room=${roomNumber}`;
            const qrGrid = document.getElementById('qrGrid');

            // Create card element
            const card = document.createElement('div');
            card.className = 'qr-card';
            card.innerHTML = `
                <div class="room-label">Room ${roomNumber}</div>
                <div class="qr-code" id="qr-${roomNumber}"></div>
                <button class="download-btn" onclick="downloadQR(${roomNumber})">⬇ Download</button>
            `;

            qrGrid.appendChild(card);

            // Generate QR code
            setTimeout(() => {
                new QRCode(document.getElementById(`qr-${roomNumber}`), {
                    text: url,
                    width: 150,
                    height: 150,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }, 100);
        }

        function downloadQR(roomNumber) {
            const qrElement = document.querySelector(`#qr-${roomNumber} img`);
            if (qrElement) {
                const link = document.createElement('a');
                link.download = `TMV_Room_${roomNumber}_QR.png`;
                link.href = qrElement.src;
                link.click();
            }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const pageW = 210, pageH = 297;
            const cols = 3, rows = 4;
            const cellW = 60, cellH = 65;
            const marginX = (pageW - cols * cellW) / 2;
            const marginY = 15;

            const cards = document.querySelectorAll('.qr-card');
            let idx = 0;

            cards.forEach((card, i) => {
                if (i > 0 && i % (cols * rows) === 0) {
                    doc.addPage();
                    idx = 0;
                }

                const col = idx % cols;
                const row = Math.floor(idx / cols);
                const x = marginX + col * cellW;
                const y = marginY + row * cellH;

                // Room label
                const label = card.querySelector('.room-label').textContent;
                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text(label, x + cellW / 2, y + 8, { align: 'center' });

                // QR image
                const img = card.querySelector('.qr-code img');
                if (img) {
                    doc.addImage(img.src, 'PNG', x + 10, y + 12, 40, 40);
                }

                // URL below
                doc.setFontSize(6);
                doc.setFont('helvetica', 'normal');
                doc.text('order.themangalview.com', x + cellW / 2, y + 58, { align: 'center' });

                idx++;
            });

            doc.save('TMV_Room_QR_Codes.pdf');
        }

        // Generate all rooms on load
        window.addEventListener('load', function() {
            generateAllRooms();
        });
    </script>
</body>
</html>
