<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMV — Order Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, #1a0a0a 0%, #2d1117 50%, #0f1923 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0d5c5;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(212,175,55,0.15);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 20px;
            color: #d4af37;
            margin-bottom: 8px;
        }

        .room-badge {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #1a0a0a;
            padding: 8px 24px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 22px;
        }

        .status-area {
            padding: 30px 10px;
        }

        .status-icon {
            font-size: 64px;
            margin-bottom: 14px;
        }

        .status-pending .status-icon { animation: pulse 2s infinite; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .status-text {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .status-pending .status-text { color: #d4af37; }
        .status-completed .status-text { color: #2ed573; }

        .status-desc {
            color: #887766;
            font-size: 15px;
        }

        .order-details {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
            text-align: left;
        }

        .order-details h3 {
            font-size: 14px;
            color: #887766;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 15px;
        }

        .order-item:last-child { border: none; }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 800;
            color: #d4af37;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(212,175,55,0.2);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #1a0a0a;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.08);
            color: #d4af37;
            border: 1px solid rgba(212,175,55,0.3);
        }

        .btn:active { transform: scale(0.97); }

        .empty-state {
            padding: 50px 20px;
            font-size: 48px;
        }

        .time-note {
            color: #665544;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Order Status</h1>
            <div class="room-badge">Room <span id="roomNumber">—</span></div>
        </div>

        <div class="card" id="statusCard">
            <div class="empty-state">📦</div>
            <p>Loading...</p>
        </div>

        <div class="actions">
            <a href="menu.html" class="btn btn-primary">Order More</a>
            <button class="btn btn-secondary" onclick="refresh()">Refresh</button>
        </div>
    </div>

    <script>
        const roomNumber = sessionStorage.getItem('userRoom') || '—';
        document.getElementById('roomNumber').textContent = roomNumber;

        function timeAgo(ts) {
            const mins = Math.floor((Date.now() - new Date(ts).getTime()) / 60000);
            if (mins < 1) return 'just now';
            if (mins < 60) return mins + ' min ago';
            const hrs = Math.floor(mins / 60);
            if (hrs < 24) return hrs + 'h ago';
            return new Date(ts).toLocaleDateString();
        }

        function renderStatus(order) {
            const card = document.getElementById('statusCard');
            if (!order) {
                card.innerHTML = `
                    <div class="empty-state">📦</div>
                    <p style="color:#665544;">No orders yet</p>
                    <p style="font-size:13px;color:#443322;margin-top:8px;">Place an order from the menu</p>`;
                return;
            }

            const isPending = order.status === 'pending' || order.status === 'accepted';
            const cls = isPending ? 'status-pending' : 'status-completed';
            const icon = isPending ? '👨‍🍳' : '✅';
            const text = order.status === 'pending' ? 'Order Received'
                       : order.status === 'accepted' ? 'Being Prepared'
                       : 'Ready!';
            const desc = isPending ? 'Your meal is being prepared...' : 'Your order is on its way!';

            let itemsHtml = '';
            if (order.items) {
                order.items.forEach(i => {
                    itemsHtml += `<div class="order-item"><span>${i.quantity}x ${i.name}</span><span>₹${i.subtotal}</span></div>`;
                });
            }

            card.innerHTML = `
                <div class="status-area ${cls}">
                    <div class="status-icon">${icon}</div>
                    <div class="status-text">${text}</div>
                    <div class="status-desc">${desc}</div>
                    <div class="time-note">Ordered ${timeAgo(order.timestamp)}</div>
                </div>
                <div class="order-details">
                    <h3>Your Order</h3>
                    ${itemsHtml}
                    <div class="order-total"><span>Total</span><span>₹${order.total}</span></div>
                </div>`;
        }

        function loadStatus(snapshot) {
            const data = snapshot.val() || {};
            const roomOrders = Object.values(data)
                .filter(o => o.room === roomNumber)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            renderStatus(roomOrders[0] || null);
        }

        function refresh() {
            const card = document.getElementById('statusCard');
            card.style.opacity = '0.5';
            setTimeout(() => card.style.opacity = '1', 300);
        }

        database.ref('orders').on('value', loadStatus);
    </script>
</body>
</html>
